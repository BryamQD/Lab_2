<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Sombras y Transiciones en CSS</title>
    <link rel="stylesheet" href="estilos.css"> </head>
<body>


           <header>
      <h1>Plataforma Educativa Universidad Central</h1>
    </header>


    <!-- # barra de navegacion -->
    <nav>

      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Cursos</a></li>
        <li><a href="#">Contacto</a></li>
        <li><a href="#">Ayuda</a></li>
      </ul>

    </nav>

    <main>

      <form action="#" method="post">

        <!-- # formulario de registro -->
        <fieldset>

          <legend>Registro de Usuario</legend>

          <div class="form-group">

            <label class="text" for="username">Nombre de Usuario:</label>
            <input class="form-input" type="text" id="username" name="username" required>
 
            <label class="text" for="email">Correo Electrónico:</label>
            <input class="form-input" type="email" id="email" name="email" required>
 
            <label for="password">Contraseña:</label>
            <input class="form-input" type="password" id="password" name="password" required>
 

          </div>

          <label for="username">Nombre de Usuario:</label>
          <input class="form-input" type="text" id="username" name="username" required>
 
          <label for="email">Correo Electrónico:</label>
          <input class="form-input" type="email" id="email" name="email" required>
 
          <label for="password">Contraseña:</label>
          <input class="form-input" type="password" id="password" name="password" required>
 

          <fieldset>
            <legend>Genero</legend>
            <div>
              <div>
                <input type="radio" value="m" name="Genero" id="g-m">
                <label for="g-m">Masculino</label>
              </div>
              <div>
                <input type="radio" value="f" name="Genero" id="g-f">
                <label for="g-f">Femenino</label>
              </div>
              <div>
                <input type="radio" value="a" name="Genero" id="g-a">
                <label for="g-a">Alien</label>
              </div>
              <div>
                <input type="radio" value="o" name="Genero" id="g-o">
                <label for="g-o">Otro</label>
              </div>
            </div>
          </fieldset>

          <fieldset>

            <legend>Intereses</legend>
            <div>
              <div>
                <input type="checkbox" name="intereses" id="interes1">
                <label for="interes1">Programación</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes2">
                <label for="interes2">Diseño Gráfico</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes3">
                <label for="interes3">Marketing Digital</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes4">
                <label for="interes4">Ciberseguridad</label>
              </div>
            </div>
          </fieldset>

          <button class="elemento" class="submit-button" type="submit">Registrar</button>

          <button class="transition-box" class="submit-button" type="submit">regis2</button>

          <button class="transition-text" class="submit-button" type="submit">regis3</button>


        </fieldset>

      </form>
 

      <!-- # video de youtube -->  
      <section class="elemento" id="video-section">

        <iframe src="https://www.youtube.com/embed/1wQ3ozoE5Qg?si=Dk6p6vIsELsiXvYl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>

      </section>

    </main>

    <!-- # pie de pagina -->
    <footer>
      <p>&copy; 2025 Plataforma Educativa Universidad Central</p>
      <p>Contacto: <a href="bryamquesadadiaz@gmail.com">Bryam Quesada Diaz</p>
    </footer>

</body>
</html>
