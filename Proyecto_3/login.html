<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina_de_Login</title>
    <link rel="stylesheet" href="login.css">s
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <a href="#">
                    <img src="https://connect-campus.uc.ac.cr/pluginfile.php/1/core_admin/logocompact/300x300/1736778698/logo%20CC-UC.png" alt="Connect Campus Logo">
                </a>
            </div>
        </div>
    </header>

    
    <main>

                <!-- # formulario de registro -->
        <fieldset class="fieldset">

          <legend>Ingreso al Connect Campus</legend>

          <div class="form-group">

            <label for="username">Usuario:</label>
            <input class="form-input" type="text" id="username" name="username" required>
 
            <label for="password">Contraseña:</label>
            <input class="form-input" type="password" id="password" name="password" required>
 

          </div>

          <button class="transition-box" type="submit">Registrar</button>

        </fieldset>

      </form>

    </main>




</body>

</html>
