    <main>
        
                <!-- # formulario de registro -->
        <fieldset class="fieldset">

          <legend>Registro de Matricula</legend>

          <div class="form-group">

            <label class="text" for="username">Nombre Completo:</label>
            <input class="form-input" type="text" id="username" name="username" required>
 
            <label class="text" for="id">Cedula:</label>
            <input class="form-input" type="number" id="id" name="id" required>
 
            <label class="text" for="email">Correo Electronico:</label>
            <input class="form-input" type="email" id="email" name="email" required>
 

          </div>
 

          <fieldset class="fieldset">
            <legend>Metodo de Pago</legend>
            <div>
              <div>
                <input type="radio" value="c" name="Pago" id="p-c">
                <label for="p-c">Cajas</label>
              </div>
              <div>
                <input type="radio" value="t" name="Pago" id="p-t">
                <label for="p-t">Transferencia Bancaria</label>
              </div>
              <div>
                <input type="radio" value="s" name="Pago" id="p-s">
                <label for="p-s">Sinpe Movil</label>
              </div>
            </div>
          </fieldset>

          <fieldset class="fieldset">

            <legend>Materias</legend>
            <div>
              <div>
                <input type="checkbox" name="Materias" id="materias1">
                <label for="materias1">Programación Internet</label>
              </div>
              <div>
                <input type="checkbox" name="Materias" id="materias2">
                <label for="materias2">Sistemas Comput.</label>
              </div>
              <div>
                <input type="checkbox" name="Materias" id="materias3">
                <label for="materias3">Arquit. Computadores</label>
              </div>
              <div>
                <input type="checkbox" name="Materias" id="materias4">
                <label for="materias4">Calculo I</label>
              </div>
            </div>
          </fieldset>

          <button class="transition-box" type="submit">Registrar</button>

        </fieldset>

      </form>

    </main>




</body>

</html>
