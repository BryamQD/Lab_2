<!-- # tipo de documento -->
<!DOCTYPE html>

<!-- # lenguaje de la pagina -->
<html lang="en"> 

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab_03</title>

  <style>
    body{
      background-color: rgba(93, 93, 198, 0.623);
      /* Color de fondo de la pagina */
    }
    .form-group label {
      display: block;
      margin-left: 5px;
      font-weight: bold;
      /* Estilo de las etiquetas del formulario */
    }
 
    .form-input {
      width: 100%;
      padding: 10px 0;
      border: 1px solid #0f0a0a;
      border-radius: 4px;
      /* Estilo de los campos de entrada del formulario */
    }
 
    .submit-button {
      padding: 4px 20px;
      border-radius: 6px;
      transition: background-color 0.3s ease;
      /* Estilo del botón de envío */
    }
 
    .submit-button:hover {
      background-color: #1f3970;
      /* Un azul más oscuro al pasar el mouse */
    }
  </style>
 

  </head>

  <!-- # cuerpo de la pagina -->
  <body>
   
    <header>
      <h1>Plataforma Educativa Universidad Central</h1>
    </header>


    <!-- # barra de navegacion -->
    <nav>

      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Cursos</a></li>
        <li><a href="#">Contacto</a></li>
        <li><a href="#">Ayuda</a></li>
      </ul>

    </nav>

    <main>

      <form action="#" method="post">

        <!-- # formulario de registro -->
        <fieldset>

          <legend>Registro de Usuario</legend>

          <div class="form-group">

            <label for="username">Nombre de Usuario:</label>
            <input class="form-input" type="text" id="username" name="username" required>
 
            <label for="email">Correo Electrónico:</label>
            <input class="form-input" type="email" id="email" name="email" required>
 
            <label for="password">Contraseña:</label>
            <input class="form-input" type="password" id="password" name="password" required>
 

          </div>

          <label for="username">Nombre de Usuario:</label>
          <input class="form-input" type="text" id="username" name="username" required>
 
          <label for="email">Correo Electrónico:</label>
          <input class="form-input" type="email" id="email" name="email" required>
 
          <label for="password">Contraseña:</label>
          <input class="form-input" type="password" id="password" name="password" required>
 

          <fieldset>
            <legend>Genero</legend>
            <div>
              <div>
                <input type="radio" value="m" name="Genero" id="g-m">
                <label for="g-m">Masculino</label>
              </div>
              <div>
                <input type="radio" value="f" name="Genero" id="g-f">
                <label for="g-f">Femenino</label>
              </div>
              <div>
                <input type="radio" value="a" name="Genero" id="g-a">
                <label for="g-a">Alien</label>
              </div>
              <div>
                <input type="radio" value="o" name="Genero" id="g-o">
                <label for="g-o">Otro</label>
              </div>
            </div>
          </fieldset>

          <fieldset>


            <legend>Intereses</legend>
            <div>
              <div>
                <input type="checkbox" name="intereses" id="interes1">
                <label for="interes1">Programación</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes2">
                <label for="interes2">Diseño Gráfico</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes3">
                <label for="interes3">Marketing Digital</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes4">
                <label for="interes4">Ciberseguridad</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes5">
                <label for="interes5">Telematica</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes6">
                <label for="interes6">Sistemas Operativos</label>
              </div>
            </div>
          </fieldset>

          <button class="submit-button" type="submit">Registrar</button>

        </fieldset>

      </form>
 

      <!-- # video de youtube -->  
      <section id="video-section">

        <iframe width="560" height="315" src="https://www.youtube.com/embed/CxKWTzr-k6s?si=87kRa0ZpWQqpY8VB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

      </section>

    </main>

</html>
